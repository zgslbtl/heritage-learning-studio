[project]
name = "heritage-learning-studio-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.0", "sqlalchemy==2.0.38",
  "asyncpg==0.30.0", "alembic==1.14.1", "pydantic==2.10.6",
  "pydantic-settings==2.7.1", "httpx==0.28.1", "python-multipart==0.0.20",
  "Pillow==11.1.0", "python-dotenv==1.0.1", "greenlet==3.1.1",
  "vercel-queue==0.10.1",
  "boto3==1.35.99",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
